services:
  gateway:
    image: kong:latest
    container_name: gateway
    ports:
      - "8000:8000"
      - "8002:8002" # Strictly for admin access, this is not secure.
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/kong.yml
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: 0.0.0.0:8002
    networks:
      - kong-network
    volumes:
      - ./gateway/kong.yml:/kong/kong.yml:ro
  users:
    build:
      context: users
    container_name: users
    networks:
      - kong-network

networks:
  kong-network:
    driver: bridge