services:

  gateway:
    image: kong:latest
    container_name: gateway
    ports:
      - "8000:8000"
      - "8002:8002" # Strictly for admin access, this is not secure.
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/kong.yml
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: 0.0.0.0:8002
    networks:
      - kong-network
    volumes:
      - ./gateway/kong.yml:/kong/kong.yml:ro

  rabbitmq:
    build:
      dockerfile: ./rabbitmq/Dockerfile
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_LOGS=rabbit.log
    healthcheck:
      test: rabbitmq-diagnostics check_port_connectivity
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 50s
    networks:
      - kong-network

  users:
    environment:
      - APP_ENV=test.env
    build:
      dockerfile: ./users/Dockerfile
    container_name: users
    networks:
      - kong-network

  scraper:
    environment:
      - APP_ENV=test.env
      - RABBITMQ_ENV=../util/rabbit_mq.test.env
    build:
      dockerfile: ./scraper/Dockerfile
    container_name: scraper
    networks:
      - kong-network
    depends_on:
      rabbitmq:
        condition: service_healthy

  analyzer:
    environment:
      - APP_ENV=test.env
      - RABBITMQ_ENV=../util/rabbit_mq.test.env
    build:
      dockerfile: ./analyzer/Dockerfile
    container_name: analyzer
    networks:
      - kong-network
    depends_on:
      rabbitmq:
        condition: service_healthy

networks:
  kong-network:
    driver: bridge