services:

  gateway:
    image: kong:latest
    container_name: gateway
    ports:
      - "8000:8000"
      - "8002:8002" # Strictly for admin access, this is not secure.
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/kong.yml
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: 0.0.0.0:8002
    networks:
      - kong-network
    volumes:
      - ./gateway/kong.yml:/kong/kong.yml:ro

  database:
    image: postgres:17.5-alpine
    container_name: database
    env_file:
      - ./util/database.test.env
#    volumes:
#      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - kong-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U admin -d users" ]
      interval: 10s
      timeout: 5s
      retries: 5

  users:
    environment:
      - APP_ENV=test.env
      - DATABASE_ENV=../util/database.test.env
    build:
      context: users
    container_name: users
    networks:
      - kong-network
    depends_on:
      database:
        condition: service_healthy

  analyzer:
    environment:
      - APP_ENV=test.env
      - DATABASE_ENV=../util/database.test.env
    build:
      context: analyzer
    container_name: analyzer
    networks:
      - kong-network
    depends_on:
      database:
        condition: service_healthy

  scraper:
    environment:
      - APP_ENV=test.env
    build:
      context: scraper
    container_name: scraper
    networks:
      - kong-network

networks:
  kong-network:
    driver: bridge

