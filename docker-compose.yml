services:

  gateway:
    image: kong:latest
    container_name: gateway
    ports:
      - "8000:8000"
      - "8002:8002" # Strictly for admin access, this is not secure.
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/kong.yml
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: 0.0.0.0:8002
    networks:
      - kong-network
    volumes:
      - ./gateway/kong.yml:/kong/kong.yml:ro

  rabbitmq:
    image: rabbitmq:4.1.0-management-alpine
    ports:
      - "15672:15672" # Management port
    environment:
      - RABBITMQ_LOGS=rabbit.log
    networks:
      - kong-network
    healthcheck:
      test: rabbitmq-diagnostics check_port_connectivity
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 50s

  elasticsearch:
    image: elasticsearch:9.0.4
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    # Just for now, will need to be enabled in the future.
      - xpack.security.enabled=false
    ports:
      - "9200:9200"
    networks:
      - kong-network
    ulimits:
      memlock:
        soft: -1
        hard: -1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://elasticsearch:9200/_cluster/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  kibana:
    image: kibana:9.0.4
    container_name: kibana
    ports:
      - "5601:5601"
    networks:
      - kong-network

  minio:
    image: minio/minio:latest
    container_name: minio
    networks:
      - kong-network
    volumes:
      - ./storage/minio:/data
    environment:
      MINIO_ROOT_USER: minio_root_user
      MINIO_ROOT_PASSWORD: minio_root_password
    command: server /data --console-address ":9001"
    #restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "nc -z localhost 9000 || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 3

  database:
    image: postgres:17.5-alpine
    container_name: database
    env_file:
      - ./util/database.test.env
#    volumes:
#      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - kong-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U admin -d users" ]
      interval: 10s
      timeout: 5s
      retries: 5

  users:
    environment:
      - APP_ENV=test.env
      - DATABASE_ENV=../util/database.test.env
    build:
      dockerfile: ./users/Dockerfile
    container_name: users
    networks:
      - kong-network
    depends_on:
      database:
        condition: service_healthy
      minio:
        condition: service_healthy

  scraper:
    environment:
      - APP_ENV=scraper/prod.env
      - RABBITMQ_ENV=util/rabbit_mq.test.env
    build:
      dockerfile: ./scraper/Dockerfile
    container_name: scraper
    networks:
      - kong-network
    depends_on:
      rabbitmq:
        condition: service_healthy

  analyzer:
    environment:
      - APP_ENV=analyzer/test.env
      - RABBITMQ_ENV=util/rabbit_mq.test.env
      - DATABASE_ENV=util/database.test.env
    build:
      dockerfile: ./analyzer/Dockerfile
    container_name: analyzer
    networks:
      - kong-network
    depends_on:
      rabbitmq:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy

  query-processor:
    environment:
      - APP_ENV=test.env
      - RABBITMQ_ENV=../util/rabbit_mq.test.env
    build:
      dockerfile: ./query_processor/Dockerfile
    container_name: query-processor
    networks:
      - kong-network
    depends_on:
      rabbitmq:
        condition: service_healthy

networks:
  kong-network:
    driver: bridge

#volumes:
  #pgdata: