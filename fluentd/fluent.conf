<system>
  enable_env true
</system>

<source>
  @type forward
  port 24224
  bind 0.0.0.0
</source>

<filter affect_pulse>
  @type record_transformer
  <record>
    hostname "#{Socket.gethostname}"
    timestamp ${time}
  </record>
</filter>

<match affect_pulse>
  @type copy
  <store>
    @type stdout
  </store>
  <store>
    @type elasticsearch
    host elasticsearch
    port 9200
    user elastic
    password changeme
    logstash_format true
    logstash_prefix fluentd
    logstash_dateformat %Y.%m.%d
    include_tag_key true
    tag_key @log_name
    flush_interval 1s

    <buffer>
      flush_thread_count 2
      flush_interval 5s
      chunk_limit_size 2M
      queue_limit_length 32
      retry_max_interval 30
      retry_forever false
    </buffer>
  </store>
</match>