name: Unit testing and linting for each service

on:
  push:

jobs:
  run-nox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Get changed services
        id: changed-files
        uses: tj-actions/changed-files@ed68ef82c095e0d48ec87eccea555d944a631a4c
        with:
          dir_names: "true"
          dir_names_max_depth: '1'
          files: |
            users/**
            scraper/**

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Nox
        run: pip install nox

      - name: Nox linting
        env:
          CHANGED_SERVICES: ${{ steps.changed-files.outputs.all_changed_files }}
        run: |
          for service in ${CHANGED_SERVICES}; do
            cd "$service"
            nox -s lint
            cd -
          done


      - name: Nox testing
        env:
          CHANGED_SERVICES: ${{ steps.changed-files.outputs.all_changed_files }}
        run: |
          for service in ${CHANGED_SERVICES}; do
            cd "$service"
            nox -s tests_with_report
            cd -
          done

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: users/coverage.json, analyzer/coverage.json
          flags: users,analyzer

